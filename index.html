<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kissy</title>

  <style>
    @import url("https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Montserrat:wght@500;600;700&display=swap");

    :root {
      --pink: #ff69bd;
      --light-pink: #ffc1e8;
      --purple: #4c174f;
      --dark: #080510;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      color: white;
      font-family: "Montserrat", sans-serif;
      background:
        radial-gradient(circle at 73% 18%, rgba(255, 104, 199, .35), transparent 18%),
        radial-gradient(circle at 35% 70%, rgba(92, 42, 151, .42), transparent 28%),
        linear-gradient(120deg, #080510, #21102f 48%, #110814);
    }

    .background {
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: -3;
      background:
        linear-gradient(90deg, rgba(2, 2, 8, .74), rgba(12, 4, 19, .15)),
        radial-gradient(circle at 50% 30%, rgba(255, 103, 190, .12), transparent 30%);
    }

    /* Window */
    .window {
      position: absolute;
      left: 4%;
      top: 7%;
      width: 58%;
      height: 78%;
      overflow: hidden;
      border: 3px solid rgba(255, 174, 228, .16);
      border-radius: 24px 24px 0 0;
      background:
        linear-gradient(rgba(35, 18, 60, .46), rgba(10, 5, 20, .6)),
        linear-gradient(135deg, #241035, #130c29 55%, #34113a);
      box-shadow: inset 0 0 70px rgba(255, 87, 190, .18);
    }

    .window::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, transparent 49.5%, rgba(255, 190, 230, .2) 50%, transparent 50.5%),
        linear-gradient(transparent 49.5%, rgba(255, 190, 230, .16) 50%, transparent 50.5%);
    }

    .moon {
      position: absolute;
      top: 14%;
      right: 20%;
      width: 82px;
      height: 82px;
      border-radius: 50%;
      background: #ffd2f4;
      box-shadow: 0 0 30px #ff8ad2, 0 0 90px rgba(255, 79, 185, .6);
    }

    .city {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 40%;
      background: linear-gradient(180deg, transparent, rgba(7, 4, 16, .92));
    }

    .building {
      position: absolute;
      bottom: 0;
      width: 12%;
      background: linear-gradient(180deg, #371844, #100919);
      box-shadow: inset 0 0 12px rgba(255, 96, 190, .2);
    }

    .building::after {
      content: "";
      position: absolute;
      inset: 12px 20%;
      background: repeating-linear-gradient(
        to bottom,
        rgba(255, 143, 217, .6) 0 3px,
        transparent 3px 17px
      );
    }

    .building:nth-child(1) { left: 5%; height: 43%; }
    .building:nth-child(2) { left: 19%; height: 67%; }
    .building:nth-child(3) { left: 34%; height: 50%; }
    .building:nth-child(4) { left: 50%; height: 78%; }
    .building:nth-child(5) { left: 67%; height: 57%; }
    .building:nth-child(6) { left: 82%; height: 70%; }

    /* Floral side decoration */
    .flowers {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: .7;
      background:
        radial-gradient(ellipse at 3% 10%, #d94391 0 5px, transparent 6px),
        radial-gradient(ellipse at 8% 23%, #f76ab4 0 7px, transparent 8px),
        radial-gradient(ellipse at 20% 8%, #d94391 0 6px, transparent 7px),
        radial-gradient(ellipse at 95% 12%, #ec62ad 0 7px, transparent 8px),
        radial-gradient(ellipse at 91% 43%, #f176bd 0 6px, transparent 7px),
        radial-gradient(ellipse at 98% 78%, #db3f98 0 8px, transparent 9px);
      background-size: 160px 180px, 230px 270px, 210px 220px, 190px 230px, 240px 300px, 180px 240px;
    }

    /* Link card */
    .card {
      position: relative;
      width: min(92%, 480px);
      margin: 0 7% 0 auto;
      padding: 46px 30px 38px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(12, 5, 18, .42);
      box-shadow: -20px 0 70px rgba(3, 0, 8, .65);
      z-index: 2;
    }

    .profile-ring {
      position: absolute;
      top: 8%;
      width: 175px;
      height: 175px;
      border: 3px solid var(--pink);
      border-radius: 50%;
      box-shadow: 0 0 12px var(--pink), 0 0 36px rgba(255, 74, 187, .8);
    }

    .profile-ring::before {
      content: "";
      position: absolute;
      inset: 9px;
      border: 1px solid rgba(255, 174, 228, .5);
      border-radius: 50%;
    }

    h1 {
      position: relative;
      margin: 90px 0 28px;
      color: #ff96d6;
      font-family: "Caveat", cursive;
      font-size: clamp(4rem, 8vw, 6.5rem);
      line-height: .8;
      font-weight: 700;
      text-shadow: 0 0 10px #ff62bb, 0 0 28px #ff4eae;
    }

    .crown {
      position: absolute;
      top: -34px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 34px;
      color: var(--light-pink);
      text-shadow: 0 0 12px var(--pink);
    }

    .links {
      width: min(100%, 355px);
      display: grid;
      gap: 13px;
    }

    .link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 56px;
      padding: 0 20px;
      border: 2px solid rgba(255, 116, 201, .8);
      border-radius: 999px;
      color: var(--light-pink);
      text-decoration: none;
      background: rgba(15, 4, 20, .8);
      box-shadow:
        0 0 10px rgba(255, 67, 180, .28),
        inset 0 0 15px rgba(255, 76, 181, .1);
      transition: .25s ease;
    }

    .link:hover {
      transform: translateY(-3px) scale(1.02);
      border-color: white;
      color: white;
      box-shadow: 0 0 22px rgba(255, 85, 188, .8);
    }

    .link-name {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: .04em;
    }

    .heart {
      font-size: 25px;
      color: var(--light-pink);
      line-height: 1;
    }

    /* Rain */
    .rain {
      position: fixed;
      inset: 0;
      z-index: 5;
      pointer-events: none;
      overflow: hidden;
    }

    .drop {
      position: absolute;
      top: -100px;
      width: 2px;
      height: 75px;
      opacity: .5;
      background: linear-gradient(transparent, #ffc7eb, transparent);
      transform: rotate(15deg);
      animation: rain linear infinite;
    }

    @keyframes rain {
      to {
        transform: translate(35px, 115vh) rotate(15deg);
        opacity: 0;
      }
    }

    /* Floating blossoms */
    .petal {
      position: fixed;
      top: -30px;
      z-index: 6;
      width: 13px;
      height: 19px;
      border-radius: 80% 0 80% 0;
      background: linear-gradient(135deg, #ffd0ee, #e63d9a);
      box-shadow: 0 0 8px rgba(255, 134, 210, .8);
      pointer-events: none;
      animation: fall linear infinite;
    }

    @keyframes fall {
      0% {
        transform: translateY(-30px) rotate(0deg);
        opacity: 0;
      }
      12% { opacity: .9; }
      100% {
        transform: translate(var(--drift), 110vh) rotate(450deg);
        opacity: 0;
      }
    }

    /* Lazy cat */
    .cat {
      position: fixed;
      left: -100px;
      bottom: 7%;
      z-index: 8;
      font-size: 55px;
      filter: drop-shadow(0 0 7px rgba(0, 0, 0, .9));
      animation: walk 28s linear infinite;
    }

    @keyframes walk {
      0% { left: -100px; transform: scaleX(1); }
      48% { left: 70%; transform: scaleX(1); }
      50% { left: 70%; transform: scaleX(-1); }
      98% { left: -100px; transform: scaleX(-1); }
      100% { left: -100px; transform: scaleX(1); }
    }

    @media (max-width: 700px) {
      body {
        overflow-y: auto;
      }

      .window {
        left: -10%;
        top: 0;
        width: 120%;
        height: 53vh;
        opacity: .62;
      }

      .card {
        width: 100%;
        min-height: 100vh;
        margin: 0;
        padding: 100px 22px 70px;
        background: rgba(8, 4, 13, .38);
      }

      .profile-ring {
        top: 6%;
        width: 140px;
        height: 140px;
      }

      h1 {
        margin-top: 65px;
      }

      .cat {
        bottom: 3%;
        font-size: 43px;
      }
    }
  </style>
</head>

<body>
  <div class="background">
    <div class="window">
      <div class="moon"></div>

      <div class="city">
        <div class="building"></div>
        <div class="building"></div>
        <div class="building"></div>
        <div class="building"></div>
        <div class="building"></div>
        <div class="building"></div>
      </div>
    </div>

    <div class="flowers"></div>
  </div>

  <main class="card">
    <div class="profile-ring"></div>

    <h1>
      <span class="crown">♛</span>
      Kissy
    </h1>

    <div class="links">
      <a class="link" href="https://www.instagram.com/v_21111_?stkn=cDd0dXQwajBqYW5u&utm_source=qr" target="_blank" rel="noopener noreferrer">
        <span class="link-name">Instagram</span>
        <span class="heart">♡</span>
      </a>

      <a class="link" href="https://snapchat.com/t/VVBv3pZv" target="_blank" rel="noopener noreferrer">
        <span class="link-name">Snapchat</span>
        <span class="heart">♡</span>
      </a>

      <a class="link" href="https://x.com/isabellasu68461?s=11" target="_blank" rel="noopener noreferrer">
        <span class="link-name">X</span>
        <span class="heart">♡</span>
      </a>

      <a class="link" href="https://open.spotify.com/user/j16j8fz7boegw1y3h2gizr7p4?si=SXeoSea7To6ts2PBibUZUQ&utm_source=copy-link" target="_blank" rel="noopener noreferrer">
        <span class="link-name">spotify</span>
        <span class="heart">♡</span>
      </a>

      <a class="link" href="https://discord.gg/5c5Yyqhcs" target="_blank" rel="noopener noreferrer">
        <span class="link-name">Discord</span>
        <span class="heart">♡</span>
      </a>

      <a class="link" href="https://pin.it/1Cd3JGcYM" target="_blank" rel="noopener noreferrer">
        <span class="link-name">pinterest</span>
        <span class="heart">♡</span>
      </a>

      <a class="link" href="https://onlyfans.com/u562981014" target="_blank" rel="noopener noreferrer">
        <span class="link-name">kissy</span>
        <span class="heart">♡</span>
      </a>
    </div>
  </main>

  <div class="rain" id="rain"></div>
  <div id="petals"></div>
  <div class="cat">🐈‍⬛</div>

  <script>
    const rain = document.getElementById("rain");
    const petals = document.getElementById("petals");

    for (let i = 0; i < 150; i++) {
      const drop = document.createElement("span");
      drop.className = "drop";
      drop.style.left = Math.random() * 100 + "vw";
      drop.style.height = 35 + Math.random() * 80 + "px";
      drop.style.animationDuration = .55 + Math.random() * .9 + "s";
      drop.style.animationDelay = Math.random() * -3 + "s";
      rain.appendChild(drop);
    }

    for (let i = 0; i < 32; i++) {
      const petal = document.createElement("span");
      petal.className = "petal";
      petal.style.left = Math.random() * 100 + "vw";
      petal.style.width = 8 + Math.random() * 9 + "px";
      petal.style.height = 12 + Math.random() * 12 + "px";
      petal.style.animationDuration = 9 + Math.random() * 15 + "s";
      petal.style.animationDelay = Math.random() * -18 + "s";
      petal.style.setProperty("--drift", (Math.random() * 220 - 110) + "px");
      petals.appendChild(petal);
    }
  </script>
</body>
</html>
