<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kissy</title>
  <style>
    :root {
      --pink-1: #ff7ac9;
      --pink-2: #ff4dc1;
      --pink-3: #ffbbeb;
      --pink-4: #ffcfef;
      --bg: #0b0712;
      --panel: rgba(15, 7, 20, 0.8);
      --glow: rgba(255, 110, 210, 0.9);
      --stroke: rgba(255, 128, 222, 0.9);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #09060d;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #09060d;
    }

    .scene {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background:
        linear-gradient(90deg, rgba(12, 8, 18, 0.42), rgba(12, 8, 18, 0.28)),
        url("background.png") center center / cover no-repeat;
    }

    .rain-layer {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 5;
    }

    .drop {
      position: absolute;
      top: -15%;
      width: 2px;
      height: 90px;
      background: linear-gradient(180deg, rgba(255,255,255,0), rgba(255,170,220,0.7), rgba(255,255,255,0));
      border-radius: 999px;
      opacity: 0.8;
      filter: drop-shadow(0 0 6px rgba(255, 120, 205, 0.35));
      animation: rainFall linear infinite;
      transform: rotate(12deg);
    }

    @keyframes rainFall {
      0% {
        transform: translate3d(0, -5vh, 0) rotate(12deg);
        opacity: 0;
      }
      12% {
        opacity: 0.9;
      }
      100% {
        transform: translate3d(25px, 120vh, 0) rotate(12deg);
        opacity: 0;
      }
    }

    .petal-layer {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 6;
    }

    .petal {
      position: absolute;
      top: -12%;
      width: 11px;
      height: 16px;
      border-radius: 70% 0 70% 0;
      background: linear-gradient(135deg, rgba(255, 220, 244, 0.95), rgba(255, 100, 190, 0.7));
      box-shadow: 0 0 10px rgba(255, 146, 214, 0.3);
      opacity: 0.85;
      animation: petalFloat linear infinite;
    }

    @keyframes petalFloat {
      0% {
        transform: translate3d(0, 0, 0) rotate(0deg);
        opacity: 0;
      }
      12% {
        opacity: 0.9;
      }
      100% {
        transform: translate3d(var(--drift-x), 110vh, 0) rotate(var(--spin));
        opacity: 0;
      }
    }

    .cat {
      position: absolute;
      left: -120px;
      bottom: 15%;
      font-size: 54px;
      filter: drop-shadow(0 0 10px rgba(0,0,0,0.7));
      z-index: 7;
      animation: catWalk 24s linear infinite;
      opacity: 0.95;
    }

    @keyframes catWalk {
      0% { left: -120px; transform: scaleX(1); }
      48% { left: 63%; transform: scaleX(1); }
      50% { left: 63%; transform: scaleX(-1); }
      98% { left: -120px; transform: scaleX(-1); }
      100% { left: -120px; transform: scaleX(1); }
    }

    .link-panel {
      position: absolute;
      right: 6%;
      top: 11%;
      width: min(26vw, 360px);
      min-width: 260px;
      height: auto;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .ring {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1.15;
      border-radius: 50%;
      border: 4px solid var(--stroke);
      background: rgba(18, 8, 21, 0.12);
      box-shadow:
        0 0 10px rgba(255, 110, 210, 0.8),
        0 0 30px rgba(255, 110, 210, 0.55),
        inset 0 0 18px rgba(255, 120, 220, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18% 10% 8%;
      overflow: hidden;
    }

    .brand {
      position: absolute;
      top: 12%;
      left: 50%;
      transform: translateX(-50%);
      font-family: "Segoe Script", "Bradley Hand", cursive;
      font-weight: 700;
      font-size: clamp(2.6rem, 3vw, 5rem);
      letter-spacing: 0.04em;
      color: var(--pink-3);
      text-shadow:
        0 0 12px rgba(255, 145, 220, 0.9),
        0 0 26px rgba(255, 77, 193, 0.75),
        0 0 42px rgba(255, 100, 170, 0.5);
      white-space: nowrap;
    }

    .brand::before {
      content: "♛";
      position: absolute;
      left: 56%;
      top: -32px;
      transform: translateX(-50%);
      font-size: 1.7rem;
      color: #ffc7ea;
      text-shadow: 0 0 14px rgba(255, 125, 230, 0.8);
    }

    .links {
      position: relative;
      width: 78%;
      margin-top: 14%;
      display: grid;
      gap: 12px;
    }

    .link {
      width: 100%;
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      border-radius: 999px;
      background: rgba(20, 7, 22, 0.7);
      border: 2px solid rgba(255, 127, 211, 0.9);
      box-shadow:
        0 0 10px rgba(255, 118, 210, 0.25),
        inset 0 0 12px rgba(255, 116, 212, 0.12);
      text-decoration: none;
      color: var(--pink-4);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .link:hover {
      transform: translateY(-2px);
      box-shadow:
        0 0 16px rgba(255, 120, 210, 0.55),
        inset 0 0 14px rgba(255, 120, 210, 0.15);
    }

    .label {
      font-size: 0.96rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: lowercase;
      color: #ffd8f6;
      text-shadow: 0 0 10px rgba(255, 128, 212, 0.5);
    }

    .heart {
      font-size: 1.2rem;
      color: var(--pink-4);
      text-shadow: 0 0 10px rgba(255, 128, 212, 0.8);
    }

    @media (max-width: 820px) {
      .link-panel {
        right: 5%;
        width: min(42vw, 360px);
        min-width: 240px;
      }

      .brand {
        font-size: clamp(2rem, 3.8vw, 4rem);
      }

      .label {
        font-size: 0.8rem;
      }
    }

    @media (max-width: 600px) {
      .scene {
        background-position: center center;
      }

      .link-panel {
        right: 4%;
        top: 14%;
        width: min(63vw, 330px);
        min-width: 220px;
      }

      .ring {
        width: 100%;
        max-width: 280px;
      }

      .brand {
        font-size: 2.2rem;
      }

      .links {
        width: 74%;
      }
    }
  </style>
</head>
<body>
  <div class="scene">
    <div class="rain-layer" id="rainLayer"></div>
    <div class="petal-layer" id="petalLayer"></div>

    <div class="cat">🐈‍⬛</div>

    <div class="link-panel">
      <div class="ring">
        <div class="brand">Kissy</div>

        <div class="links">
          <a class="link" href="https://www.instagram.com/v_21111_?stkn=cDd0dXQwajBqYW5u&utm_source=qr" target="_blank" rel="noopener">
            <span class="label">Instagram</span>
            <span class="heart">♡</span>
          </a>

          <a class="link" href="https://snapchat.com/t/VVBv3pZv" target="_blank" rel="noopener">
            <span class="label">Snapchat</span>
            <span class="heart">♡</span>
          </a>

          <a class="link" href="https://x.com/isabellasu68461?s=11" target="_blank" rel="noopener">
            <span class="label">X</span>
            <span class="heart">♡</span>
          </a>

          <a class="link" href="https://open.spotify.com/user/j16j8fz7boegw1y3h2gizr7p4?si=SXeoSea7To6ts2PBibUZUQ&utm_source=copy-link" target="_blank" rel="noopener">
            <span class="label">spotify</span>
            <span class="heart">♡</span>
          </a>

          <a class="link" href="https://discord.gg/5c5Yyqhcs" target="_blank" rel="noopener">
            <span class="label">Discord</span>
            <span class="heart">♡</span>
          </a>

          <a class="link" href="https://pin.it/1Cd3JGcYM" target="_blank" rel="noopener">
            <span class="label">pinterest</span>
            <span class="heart">♡</span>
          </a>

          <a class="link" href="https://onlyfans.com/u562981014" target="_blank" rel="noopener">
            <span class="label">kissy</span>
            <span class="heart">♡</span>
          </a>
        </div>
      </div>
    </div>
  </div>

  <script>
    const rainLayer = document.getElementById("rainLayer");
    const petalLayer = document.getElementById("petalLayer");

    for (let i = 0; i < 130; i++) {
      const drop = document.createElement("span");
      drop.className = "drop";
      drop.style.left = Math.random() * 100 + "%";
      drop.style.height = (35 + Math.random() * 90) + "px";
      drop.style.animationDuration = (0.6 + Math.random() * 1.2) + "s";
      drop.style.animationDelay = (Math.random() * -2.5) + "s";
      rainLayer.appendChild(drop);
    }

    for (let i = 0; i < 32; i++) {
      const petal = document.createElement("span");
      petal.className = "petal";
      petal.style.left = (Math.random() * 100) + "%";
      petal.style.width = (9 + Math.random() * 8) + "px";
      petal.style.height = (16 + Math.random() * 12) + "px";
      petal.style.animationDuration = (9 + Math.random() * 16) + "s";
      petal.style.animationDelay = (Math.random() * -18) + "s";
      petal.style.setProperty("--drift-x", (Math.random() * 120 - 60) + "px");
      petal.style.setProperty("--spin", (Math.random() * 520 - 260) + "deg");
      petalLayer.appendChild(petal);
    }
  </script>
</body>
</html>
