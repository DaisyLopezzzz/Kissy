<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: Arial, sans-serif;
        }

        .picture {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            z-index: 1;
        }

        /* PROFILE PHOTO IN RED CIRCLE */
        .avatar {
            position: fixed;
            top: 20%;
            left: 50%;
            transform: translateX(-50%);
            width: 300px;
            height: 300px;
            border-radius: 50%;
            object-fit: cover;
            object-position: center;
            z-index: 30;
            border: 8px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 0 25px rgba(255, 40, 40, 0.4);
            background: #ff1b15;
        }

        /* BLOSSOMS */
        .petals {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 20;
        }

        .petal {
            position: absolute;
            width: 10px;
            height: 7px;
            border-radius: 70% 30% 70% 30%;
            background: rgba(255,105,170,0.72);

            animation:
                fall linear infinite,
                sway ease-in-out infinite alternate;
        }

        @keyframes fall {
            from {
                transform: translateY(-40px) rotate(0deg);
            }

            to {
                transform: translateY(110vh) rotate(360deg);
            }
        }

        @keyframes sway {
            from {
                margin-left: -25px;
            }

            to {
                margin-left: 25px;
            }
        }

        /* LITTLE BLACK CAT */
        .cat {
            position: fixed;
            bottom: 3px;
            left: -45px;
            z-index: 100;
            font-size: 30px;
            line-height: 1;
            pointer-events: none;
            animation: catWalk 20s linear infinite;
        }

        @keyframes catWalk {
            0% {
                left: -45px;
            }

            42% {
                left: 42%;
            }

            48% {
                left: 42%;
            }

            100% {
                left: 105%;
            }
        }

        /* CLICKABLE LINK BOXES WITH TEXT */
        .link-box {
            position: fixed;
            left: 67.1%;
            width: 18%;
            height: 5%;
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            cursor: pointer;
            font-style: italic;
            font-size: 16px;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .link-box:hover {
            color: rgba(255, 105, 170, 1);
            text-shadow: 0 0 10px rgba(255, 105, 170, 0.5);
        }

        .instagram { top: 47.2%; }
        .tiktok { top: 53.5%; }
        .onlyfans { top: 60%; }
        .twitter { top: 66.3%; }
        .spotify { top: 72.5%; }
        .amazon { top: 78.7%; }
    </style>
</head>

<body>

    <!-- BACKGROUND IMAGE -->
    <img
        class="picture"
        src="background.png"
        alt=""
    >

    <!-- PROFILE PHOTO IN RED CIRCLE -->
    <img
        class="avatar"
        src="avatar.png"
        alt="Kissy profile picture"
    >

    <!-- ANIMATION (PETALS ONLY) -->
    <div class="petals"></div>

    <!-- LINKS WITH TEXT -->
    <a class="link-box instagram" href="https://www.instagram.com/v_21111_/" target="_blank">instagram</a>
    <a class="link-box tiktok" href="https://www.tiktok.com/@hbun1149icv" target="_blank">tiktok</a>
    <a class="link-box onlyfans" href="https://onlyfans.com/u562981014" target="_blank">onlyfans</a>
    <a class="link-box twitter" href="https://x.com/IsabellSu68461" target="_blank">twitter</a>
    <a class="link-box spotify" href="https://open.spotify.com/user/j16j8fz7boegw1y3h2gizr7p4?si=OJNaoN7fSNmLELFGLrQRKQ&utm_source=copy-link" target="_blank">spotify</a>
    <a class="link-box amazon" href="https://www.amazon.com/hz/wishlist/ls/20PAZF3BQP686?ref_=wl_share" target="_blank">amazon wishlist</a>

    <!-- LITTLE BLACK CAT -->
    <div class="cat">🐈‍⬛</div>

    <script>
        const petals = document.querySelector(".petals");

        for (let i = 0; i < 22; i++) {
            const petal = document.createElement("div");
            petal.className = "petal";

            petal.style.left = Math.random() * 100 + "%";
            petal.style.top = Math.random() * -100 + "px";
            petal.style.animationDuration = (7 + Math.random() * 7) + "s";
            petal.style.animationDelay = Math.random() * 8 + "s";

            petals.appendChild(petal);
        }
    </script>

</body>
</html>
