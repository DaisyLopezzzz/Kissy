<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kissy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a020d;
            --pink-1: #ff4db8;
            --pink-2: #ff78c9;
            --pink-3: #ffd0ef;
            --glass: rgba(20, 0, 20, 0.25);
            --line: rgba(255, 127, 205, 0.9);
            --text: #fff1fb;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-dark);
            font-family: Arial, Helvetica, sans-serif;
            overflow: hidden;
        }

        body {
            position: relative;
        }

        .background {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            filter: saturate(1.15) contrast(1.02);
        }

        .layout {
            position: relative;
            width: 100%;
            height: 100%;
            z-index: 2;
        }

        .avatar-panel {
            position: absolute;
            left: 3.5%;
            top: 16%;
            width: 35%;
            height: 52%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .avatar-frame {
            position: relative;
            width: min(28vw, 330px);
            height: min(28vw, 330px);
            border-radius: 50%;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.12);
            box-shadow: 0 0 20px rgba(255, 97, 188, 0.35);
            border: 4px solid rgba(255, 204, 234, 0.7);
        }

        .avatar {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            filter: saturate(0.9) contrast(1.1);
        }

        .right-panel {
            position: absolute;
            right: 5%;
            top: 8%;
            width: 36%;
            height: 76%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .ring {
            position: relative;
            width: min(31vw, 390px);
            height: min(31vw, 390px);
            border-radius: 50%;
            border: 5px solid rgba(255, 100, 200, 0.95);
            box-shadow: 0 0 22px rgba(255, 100, 200, 0.9), 0 0 32px rgba(255, 100, 200, 0.5);
            background: rgba(255, 255, 255, 0.02);
            margin-bottom: -8px;
        }

        .name {
            position: relative;
            margin-top: -12px;
            font-family: 'Great Vibes', cursive;
            font-size: clamp(52px, 5vw, 96px);
            line-height: 1;
            letter-spacing: 1px;
            color: #ff8fe2;
            text-shadow: 0 0 10px rgba(255, 136, 225, 1), 0 0 20px rgba(255, 136, 225, 0.8), 0 0 30px rgba(255, 136, 225, 0.6);
        }

        .name::before {
            content: "♛";
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            top: -28px;
            font-size: 0.65em;
            color: #ff8fe2;
            text-shadow: 0 0 10px rgba(255, 136, 225, 1), 0 0 18px rgba(255, 136, 225, 0.8);
        }

        .links {
            width: min(31vw, 370px);
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 10px;
        }

        .link-item {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 14px;
            width: 100%;
            height: 52px;
            padding: 0 18px 0 18px;
            border-radius: 999px;
            border: 2px solid rgba(255, 126, 210, 0.9);
            background: rgba(5, 0, 13, 0.25);
            color: var(--text);
            text-decoration: none;
            box-shadow: inset 0 0 12px rgba(255, 120, 200, 0.08), 0 0 10px rgba(255, 105, 180, 0.15);
            overflow: hidden;
        }

        .link-item:before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: linear-gradient(135deg, rgba(255,255,255,0.04), rgba(255, 126, 210, 0.02));
        }

        .icon {
            position: relative;
            z-index: 1;
            width: 24px;
            height: 24px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #ff9ddf;
            stroke: currentColor;
            fill: none;
            stroke-width: 2.2;
            flex-shrink: 0;
        }

        .label {
            position: relative;
            z-index: 1;
            flex: 1;
            font-family: 'Great Vibes', cursive;
            font-size: clamp(18px, 1.7vw, 30px);
            letter-spacing: 0.4px;
            color: #ffd9f7;
            text-shadow: 0 0 8px rgba(255, 160, 225, 0.6), 0 0 14px rgba(255, 160, 225, 0.4);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .heart {
            position: relative;
            z-index: 1;
            font-size: 22px;
            line-height: 1;
            color: #ff9ddf;
            filter: drop-shadow(0 0 8px rgba(255, 150, 220, 0.8));
            margin-left: auto;
        }

        @media (max-width: 980px) {
            .right-panel {
                right: 2%;
                width: 42%;
            }
            .avatar-panel {
                left: 1%;
                width: 40%;
            }
        }
    </style>
</head>
<body>
    <img class="background" src="background.png" alt="">

    <div class="layout">
        <div class="avatar-panel">
            <div class="avatar-frame">
                <img class="avatar" src="avatar.png" alt="Kissy avatar">
            </div>
        </div>

        <div class="right-panel">
            <div class="ring"></div>
            <div class="name">Kissy</div>

            <div class="links">
                <a class="link-item" href="https://www.instagram.com/v_21111_/" target="_blank" rel="noreferrer">
                    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                        <rect x="3.5" y="3.5" width="17" height="17" rx="4"></rect>
                        <circle cx="12" cy="12" r="4.2"></circle>
                        <circle cx="17.3" cy="6.7" r="1.1" fill="currentColor" stroke="none"></circle>
                    </svg>
                    <span class="label">instagram</span>
                    <span class="heart">♡</span>
                </a>

                <a class="link-item" href="https://www.tiktok.com/@hbun1149icv" target="_blank" rel="noreferrer">
                    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M15.5 3.5c.9 2.1 2.8 3.5 5 3.8v3.3c-1.8-.1-3.5-.9-5-2.1v6.7a5.3 5.3 0 1 1-5.3-5.3c.4 0 .8 0 1.1.1v3.3a2.3 2.3 0 1 0 1.8 2.2V3.5h2.4Z" stroke-linecap="round" stroke-linejoin="round"></path>
                    </svg>
                    <span class="label">tiktok</span>
                    <span class="heart">♡</span>
                </a>

                <a class="link-item" href="https://onlyfans.com/u562981014" target="_blank" rel="noreferrer">
                    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                        <rect x="4" y="5" width="16" height="14" rx="3"></rect>
                        <path d="M8 10.5h8M8 13.5h5"></path>
                    </svg>
                    <span class="label">onlyfans</span>
                    <span class="heart">♡</span>
                </a>

                <a class="link-item" href="https://x.com/IsabellSu68461" target="_blank" rel="noreferrer">
                    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M5 5l14 14M19 5L5 19"></path>
                    </svg>
                    <span class="label">twitter</span>
                    <span class="heart">♡</span>
                </a>

                <a class="link-item" href="https://open.spotify.com/user/j16j8fz7boegw1y3h2gizr7p4?si=OJNaoN7fSNmLELFGLrQRKQ&utm_source=copy-link" target="_blank" rel="noreferrer">
                    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                        <circle cx="12" cy="12" r="8.5"></circle>
                        <path d="M8.5 15.5c2.6-1.1 6.4-1 9.2.5M8 12.8c2.1-1.1 5.4-.9 7.6.7M8.3 10.1c1.6-.8 3.9-.7 5.8.5"></path>
                    </svg>
                    <span class="label">spotify</span>
                    <span class="heart">♡</span>
                </a>

                <a class="link-item" href="https://www.amazon.com/hz/wishlist/ls/20PAZF3BQP686?ref_=wl_share" target="_blank" rel="noreferrer">
                    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M7 7.5h10a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2Z"></path>
                        <path d="M9 7.5V6.8A3 3 0 0 1 12 4a3 3 0 0 1 3 2.8v.7"></path>
                    </svg>
                    <span class="label">amazon wishlist</span>
                    <span class="heart">♡</span>
                </a>
            </div>
        </div>
    </div>
</body>
</html>
