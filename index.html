<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kissy</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #09060d;
      font-family: "Segoe UI", sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #09060d;
    }

    .scene {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: url("background.png") center center / cover no-repeat;
    }

    .rain-layer,
    .petal-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 5;
      overflow: hidden;
    }

    .drop {
      position: absolute;
      top: -20%;
      width: 2px;
      height: 90px;
      background: linear-gradient(180deg, rgba(255,255,255,0), rgba(255,170,220,0.8), rgba(255,255,255,0));
      opacity: 0.8;
      animation: rain linear infinite;
      transform: rotate(10deg);
      filter: drop-shadow(0 0 7px rgba(255,120,205,0.3));
    }

    @keyframes rain {
      0% {
        transform: translate3d(0, -20vh, 0) rotate(10deg);
        opacity: 0;
      }
      12% { opacity: 0.9; }
      100% {
        transform: translate3d(30px, 130vh, 0) rotate(10deg);
        opacity: 0;
      }
    }

    .petal {
      position: absolute;
      top: -20%;
      width: 12px;
      height: 18px;
      border-radius: 80% 0 80% 0;
      background: linear-gradient(135deg, rgba(255, 228, 247, 0.95), rgba(255, 120, 200, 0.7));
      box-shadow: 0 0 8px rgba(255, 140, 220, 0.4);
      opacity: 0.9;
      animation: petalFall linear infinite;
    }

    @keyframes petalFall {
      0% {
        transform: translate3d(0, 0, 0) rotate(0deg);
        opacity: 0;
      }
      15% { opacity: 1; }
      100% {
        transform: translate3d(var(--drift-x), 110vh, 0) rotate(var(--spin));
        opacity: 0;
      }
    }

    .cat {
      position: absolute;
      left: -100px;
      bottom: 7%;
      font-size: 60px;
      z-index: 8;
      animation: catWalk 24s linear infinite;
      filter: drop-shadow(0 0 9px rgba(0,0,0,0.7));
    }

    @keyframes catWalk {
      0% { left: -100px; transform: scaleX(1); }
      48% { left: 60%; transform: scaleX(1); }
      50% { left: 60%; transform: scaleX(-1); }
      98% { left: -100px; transform: scaleX(-1); }
      100% { left: -100px; transform: scaleX(1); }
    }

    .link-panel {
      position: absolute;
      right: 6%;
      top: 12%;
      width: min(27vw, 370px);
      min-width: 260px;
      z-index: 9;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ring {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1.2;
      border-radius: 50%;
      border: 4px solid rgba(255, 130, 215, 0.9);
      background: rgba(21, 10, 20, 0.12);
      box-shadow:
        0 0 10px rgba(255, 120, 210, 0.7),
        0 0 30px rgba(255, 120, 210, 0.45),
        inset 0 0 18px rgba(255, 120, 210, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18% 10% 8%;
    }

    .brand {
      position: absolute;
      top: 14%;
      left: 50%;
      transform: translateX(-50%);
      white-space: nowrap;
      font-family: "Segoe Script", "Bradley Hand", cursive;
      font-size: clamp(2.8rem, 3vw, 5rem);
      color: #f9c8ef;
      font-weight: 700;
      text-shadow:
        0 0 12px rgba(255, 140, 220, 0.9),
        0 0 28px rgba(255, 81, 191, 0.7);
    }

    .brand::before {
      content: "♛";
      position: absolute;
      left: 50%;
      top: -34px;
      transform: translateX(-50%);
      font-size: 1.5rem;
      color: #ffd7f0;
      text-shadow: 0 0 12px rgba(255,120,210,0.8);
    }

    .links {
      width: 78%;
      margin-top: 18%;
      display: grid;
      gap: 12px;
    }

    .link {
      width: 100%;
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      border: 2px solid rgba(255, 125, 210, 0.9);
      border-radius: 999px;
      background: rgba(20, 9, 22, 0.72);
      box-shadow:
        0 0 8px rgba(255, 124, 210, 0.2),
        inset 0 0 12px rgba(255, 124, 210, 0.1);
      text-decoration: none;
      color: #ffe3f9;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .link:hover {
      transform: translateY(-2px);
      box-shadow:
        0 0 16px rgba(255, 120, 210, 0.5),
        inset 0 0 14px rgba(255, 120, 210, 0.15);
    }

    .label {
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: lowercase;
      color: #ffe9fb;
      text-shadow: 0 0 10px rgba(255, 120, 210, 0.5);
    }

    .heart {
      font-size: 1.05rem;
      color: #ffd2f1;
      text-shadow: 0 0 8px rgba(255, 120, 210, 0.8);
    }

    @media (max-width: 700px) {
      .link-panel {
        right: 4%;
        width: min(60vw, 320px);
        min-width: 220px;
      }

      .brand {
        font-size: 2.1rem;
      }

      .label {
        font-size: 0.75rem;
      }
    }
  </style>
</head>
<body>
  <div class="scene">
    <div class="rain-layer" id="rainLayer"></div>
    <div class="petal-layer" id="petalLayer"></div>

    <div class="cat">🐈‍⬛</div>

    <div class="link-panel">
      <div class="ring">
        <div class="brand">Kissy</div>

        <div class="links">
          <a class="link" href="https://www.instagram.com/v_21111_?stkn=cDd0dXQwajBqYW5u&utm_source=qr" target="_blank" rel="noopener">
            <span class="label">Instagram</span>
            <span class="heart">♡</span>
          </a>

          <a class="link" href="https://snapchat.com/t/VVBv3pZv" target="_blank" rel="noopener">
            <span class="label">Snapchat</span>
            <span class="heart">♡</span>
          </a>

          <a class="link" href="https://x.com/isabellasu68461?s=11" target="_blank" rel="noopener">
            <span class="label">X</span>
            <span class="heart">♡</span>
          </a>

          <a class="link" href="https://open.spotify.com/user/j16j8fz7boegw1y3h2gizr7p4?si=SXeoSea7To6ts2PBibUZUQ&utm_source=copy-link" target="_blank" rel="noopener">
            <span class="label">spotify</span>
            <span class="heart">♡</span>
          </a>

          <a class="link" href="https://discord.gg/5c5Yyqhcs" target="_blank" rel="noopener">
            <span class="label">Discord</span>
            <span class="heart">♡</span>
          </a>

          <a class="link" href="https://pin.it/1Cd3JGcYM" target="_blank" rel="noopener">
            <span class="label">pinterest</span>
            <span class="heart">♡</span>
          </a>

          <a class="link" href="https://onlyfans.com/u562981014" target="_blank" rel="noopener">
            <span class="label">kissy</span>
            <span class="heart">♡</span>
          </a>
        </div>
      </div>
    </div>
  </div>

  <script>
    const rainLayer = document.getElementById("rainLayer");
    const petalLayer = document.getElementById("petalLayer");

    for (let i = 0; i < 120; i++) {
      const drop = document.createElement("span");
      drop.className = "drop";
      drop.style.left = Math.random() * 100 + "%";
      drop.style.height = (30 + Math.random() * 90) + "px";
      drop.style.animationDuration = (0.7 + Math.random() * 1.3) + "s";
      drop.style.animationDelay = (Math.random() * -3) + "s";
      rainLayer.appendChild(drop);
    }

    for (let i = 0; i < 30; i++) {
      const petal = document.createElement("span");
      petal.className = "petal";
      petal.style.left = Math.random() * 100 + "%";
      petal.style.width = (9 + Math.random() * 8) + "px";
      petal.style.height = (13 + Math.random() * 11) + "px";
      petal.style.animationDuration = (9 + Math.random() * 15) + "s";
      petal.style.animationDelay = (Math.random() * -15) + "s";
      petal.style.setProperty("--drift-x", (Math.random() * 120 - 60) + "px");
      petal.style.setProperty("--spin", (Math.random() * 520 - 260) + "deg");
      petalLayer.appendChild(petal);
    }
  </script>
</body>
</html>
